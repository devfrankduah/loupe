name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install loupe with the test and render extras
        run: pip install -e ".[test,render]" "mypy==2.4.1"
      - name: Install Chromium for the rendered tests
        run: python -m playwright install --with-deps chromium
      - name: Type check
        run: mypy --strict src tests
      - name: Run the tests, failing if any are skipped
        run: |
          pytest -q -rs | tee pytest-output.txt
          if grep -q '^SKIPPED' pytest-output.txt; then
            echo "Some tests were skipped. The rendered tests need Chromium."
            exit 1
          fi
