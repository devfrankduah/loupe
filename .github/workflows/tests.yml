name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install loupe with the test and render extras
        run: pip install -e ".[test,render]" "mypy==2.4.1" types-jsonschema
      - name: Install Chromium for the rendered tests
        run: python -m playwright install --with-deps chromium
      - name: Type check
        run: mypy --strict src tests
      # The tests run on the local backend against pages served from 127.0.0.1,
      # in both scan modes, and refuse any other connection. They need no secrets.
      - name: Check that no Bright Data credentials are set
        run: |
          if [ -n "${BRIGHTDATA_API_TOKEN:-}${BRIGHTDATA_BROWSER_WSS:-}" ]; then
            echo "Bright Data credentials are set, but the tests must run without them."
            exit 1
          fi
      - name: Run the tests, failing if any are skipped
        run: |
          pytest -q -rs | tee pytest-output.txt
          if grep -q '^SKIPPED' pytest-output.txt; then
            echo "Some tests were skipped. The rendered tests need Chromium."
            exit 1
          fi

  action:
    name: GitHub Action, against the test pages served in the job
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that no Bright Data credentials are set
        run: |
          if [ -n "${BRIGHTDATA_API_TOKEN:-}${BRIGHTDATA_BROWSER_WSS:-}" ]; then
            echo "Bright Data credentials are set, but the action test must run without them."
            exit 1
          fi
      - name: Serve the test pages from this job
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory docs > /dev/null 2>&1 &
          for attempt in $(seq 100); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/test-page/; then exit 0; fi
            sleep 0.1
          done
          echo "The test page server didn't start."
          exit 1

      - name: Both test pages with fail-on never, which passes
        id: never
        uses: ./
        with:
          urls: |
            http://127.0.0.1:8000/test-page/
            http://127.0.0.1:8000/animated-page/
          fail-on: never
          artifact-name: loupe-never
      - name: The blender page rendered with the default fail-on, which fails with 1
        id: rendered
        continue-on-error: true
        uses: ./
        with:
          urls: http://127.0.0.1:8000/test-page/
          render: "true"
          artifact-name: loupe-rendered
      # The second "URL" would run a command if an input ever reached the shell as code.
      - name: A missing page and a hostile input, which fail with 2
        id: missing
        continue-on-error: true
        uses: ./
        with:
          urls: http://127.0.0.1:8000/no-such-page/ $(touch${IFS}injected)
          fail-on: never
          artifact-name: loupe-missing
      - name: An input the action doesn't accept, which fails before loupe runs
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          urls: http://127.0.0.1:8000/test-page/
          render: sometimes
          artifact-name: loupe-invalid

      - name: Check each outcome, exit code and results file
        env:
          OUTCOMES: >-
            ${{ steps.never.outcome }} ${{ steps.never.outputs.exit-code }}
            ${{ steps.rendered.outcome }} ${{ steps.rendered.outputs.exit-code }}
            ${{ steps.missing.outcome }} ${{ steps.missing.outputs.exit-code }}
            ${{ steps.invalid.outcome }} [${{ steps.invalid.outputs.exit-code }}]
          NEVER_RESULTS: ${{ steps.never.outputs.results }}
          RENDERED_RESULTS: ${{ steps.rendered.outputs.results }}
          MISSING_RESULTS: ${{ steps.missing.outputs.results }}
        run: |
          expected="success 0 failure 1 failure 2 failure []"
          if [ "$OUTCOMES" != "$expected" ]; then
            echo "Expected outcomes and exit codes '$expected', got '$OUTCOMES'."
            exit 1
          fi
          if [ -e injected ]; then
            echo "An input ran as a shell command."
            exit 1
          fi
          python3 -I .github/scripts/check_action_results.py "$NEVER_RESULTS" "$RENDERED_RESULTS" "$MISSING_RESULTS"

  # A separate job, because an artifact can take a moment to be listed after
  # its upload finishes, and a download in the same job can miss it.
  action-artifacts:
    name: GitHub Action, the uploaded results
    needs: action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the uploaded results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded
      - name: Check one artifact per scan, with the results in it
        run: |
          found="$(cd downloaded && ls | tr '\n' ' ')"
          if [ "$found" != "loupe-missing loupe-never loupe-rendered " ]; then
            echo "Expected the loupe-missing, loupe-never and loupe-rendered artifacts, found: $found"
            exit 1
          fi
          python3 -I .github/scripts/check_action_results.py \
            downloaded/loupe-never/results.json downloaded/loupe-rendered/results.json downloaded/loupe-missing/results.json
