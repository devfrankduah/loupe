# Publishes loupe-scan to PyPI when a GitHub release is published, and at no
# other time. It uses PyPI's trusted publishing: PyPI trusts this workflow,
# running in this repository's "pypi" environment, to upload the project, so
# no token is stored anywhere. docs/releasing.md has the one-time setup.
name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check the release is tagged with the package's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -I -c 'import runpy; print(runpy.run_path("src/loupe_scan/_version.py")["__version__"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "The release is tagged $TAG, but the package is version $version. Tag the release v$version."
            exit 1
          fi
      - name: Build the sdist and wheel and check them
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/loupe-scan/
    permissions:
      # The OpenID Connect token trusted publishing exchanges for a short-lived upload token.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
