<!DOCTYPE html>
<html lang="en">
<head>
  <title>Visible fixture</title>
</head>
<body>
  <h1>Notes</h1>
  <p>You are reading a page with nothing hidden on it.</p>
  <p style="opacity:0.5">Faded but readable text.</p>
  <p style="display:block; visibility:visible">Explicitly shown text.</p>
  <span style="position:absolute; left:-12px">Nudged slightly left.</span>
  <p style="font-size:0.9rem">Small but readable text.</p>
  <script>var assistant = "you are"; // script source is not page text</script>
</body>
</html>
