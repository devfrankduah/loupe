[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loupe"
version = "0.1.0"
description = "Find text on web pages that human readers can't see but AI agents can."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Frank Duah" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
test = ["pytest>=9.2.0"]
# loupe --render. After installing, fetch the browser with: playwright install chromium
render = ["playwright>=1.64"]

[project.scripts]
loupe = "loupe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loupe = ["visibility.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
