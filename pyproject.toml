[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loupe-scan"
dynamic = ["version"]
description = "Find text on web pages that human readers can't see but AI agents can."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Frank Duah" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    # read1, which the local fetch uses to enforce its time limit, arrived in urllib3 2.2.
    "urllib3>=2.2",
    "beautifulsoup4>=4.12",
    # robots.txt for the local backend, with RFC 9309 wildcards.
    "protego>=0.4",
    # The local backend's markdown, an approximation of what agent tools produce.
    "markdownify>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18"]
# loupe --render. After installing, fetch the browser with: playwright install chromium
render = ["playwright>=1.64"]
# loupe mcp, the MCP server. Version 2 of the SDK renamed FastMCP to MCPServer, which loupe uses.
mcp = ["mcp>=2.3,<3"]

[project.scripts]
loupe = "loupe_scan.cli:main"

[tool.setuptools.dynamic]
version = { attr = "loupe_scan._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# py.typed tells type checkers the package ships its own types (PEP 561).
loupe_scan = ["visibility.js", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
